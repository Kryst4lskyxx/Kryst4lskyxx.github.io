<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
  <title id="title">One query, two native connections</title>
  <desc id="desc">The Go application reports version 2.31.0 and connects as app_reader to a ClickHouse 25.8 coordinator with analyzer 1. The coordinator connects as default to a ClickHouse 25.8 remote server. The remote server mistakes the original application version for an old server and switches to analyzer 0.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#334155"/></marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#b45309"/></marker>
  </defs>
  <rect width="1040" height="440" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#0f172a">
    <text x="30" y="43" font-size="26" font-weight="700">One query, two native connections</text>
    <rect x="28" y="83" width="245" height="190" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="48" y="119" font-size="21" font-weight="700">Go application</text>
    <text x="48" y="151" font-size="19">Driver version: 2.31.0</text>
    <text x="48" y="181" font-size="19">Protocol: 54460</text>
    <text x="48" y="225" font-size="18" fill="#475569">Connects as</text>
    <text x="48" y="251" font-size="20" font-family="ui-monospace, monospace">app_reader</text>
    <rect x="386" y="83" width="245" height="190" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="406" y="119" font-size="21" font-weight="700">Coordinator</text>
    <text x="406" y="151" font-size="19">ClickHouse 25.8</text>
    <text x="406" y="181" font-size="19" fill="#1d4ed8">Analyzer: 1</text>
    <text x="406" y="225" font-size="18" fill="#475569">Connects to remote as</text>
    <text x="406" y="251" font-size="20" font-family="ui-monospace, monospace">default</text>
    <rect x="744" y="83" width="268" height="190" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="764" y="119" font-size="21" font-weight="700">Remote server</text>
    <text x="764" y="151" font-size="19">ClickHouse 25.8</text>
    <text x="764" y="181" font-size="19" fill="#b45309">Analyzer: 1 → 0</text>
    <text x="764" y="225" font-size="18" fill="#475569">Original app metadata</text>
    <text x="764" y="251" font-size="19">still says 2.31.0</text>
    <path d="M 282 177 H 376" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="330" y="160" font-size="17" text-anchor="middle">Initial query</text>
    <path d="M 640 177 H 734" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="687" y="146" font-size="17" text-anchor="middle">Secondary</text>
    <text x="687" y="166" font-size="17" text-anchor="middle">query</text>
    <path d="M 877 281 V 316 H 510 V 282" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#return)"/>
    <rect x="591" y="300" width="229" height="31" rx="8" fill="#fff7ed"/>
    <text x="705" y="322" font-size="18" text-anchor="middle" fill="#92400e">Returns event_name</text>
    <rect x="28" y="354" width="984" height="62" rx="12" fill="#e2e8f0"/>
    <text x="48" y="380" font-size="18">The coordinator expects __table1.event_name.</text>
    <text x="48" y="404" font-size="18">Different analyzers produce incompatible names in the intermediate block.</text>
  </g>
</svg>
